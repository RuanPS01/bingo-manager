name: Testes

# Roda em todo pull request e também é usado pelo workflow de publicação.
# A simulação de 60 partidas roda em um job separado, em paralelo, e só nos
# pull requests: na publicação (merge na main) o código já foi validado por ela.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      simulacao:
        description: "Rodar a simulação de 60 partidas ('sim' ou 'nao')"
        type: string
        default: 'sim'

permissions:
  contents: read

jobs:
  rapidos:
    name: Tipos, unitários e fluxos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Instalar navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (fluxos, sorteador, gerador, leitura por foto e transmissão)
        run: npm run test:e2e:fluxos
        env:
          CI: 'true'

      - name: Guardar relatório dos testes
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-fluxos
          path: playwright-report
          retention-days: 14

  simulacao:
    name: Simulação de 60 partidas
    if: ${{ inputs.simulacao != 'nao' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: 20 partidas por cartela, conferidas contra o oráculo
        run: npm run test:e2e:simulacao
        env:
          CI: 'true'

      - name: Guardar relatório dos testes
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-simulacao
          path: playwright-report
          retention-days: 14
