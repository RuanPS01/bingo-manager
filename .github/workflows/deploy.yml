name: Publicar no GitHub Pages

# Publica o site a cada merge (push) na branch main, depois dos testes rápidos
# (formatação, tipos, unitários e fluxos de ponta a ponta). A simulação de 60
# partidas já rodou no pull request, então não é repetida aqui.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/testes.yml
    with:
      simulacao: 'nao'

  build:
    name: Gerar site
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
