<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10306b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Acompanhamento das cartelas do Show de Prêmios APAE Santa Rita do Sapucaí 2026" />
    <meta name="apple-mobile-web-app-title" content="Bingo APAE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bingo APAE 2026</title>
    <script>
      // Aplica o tema salvo antes de a página aparecer, sem piscar em claro.
      (function () {
        try {
          var salvo = JSON.parse(localStorage.getItem('bingo-apae-2026:v1') || '{}');
          var tema = salvo && salvo.settings && salvo.settings.theme;
          if (tema !== 'light' && tema !== 'dark') {
            tema = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
